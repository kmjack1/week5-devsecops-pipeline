name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - feature-update
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint / Code Quality Checks
        run: |
          echo "Linting skipped for now"

      - name: Run Unit Tests
        run: |
          pytest

      - name: Security Scan
        run: |
          echo "Running simulated SAST, dependency scan, and secret scan"

      - name: Build Artifact
        run: |
          mkdir -p dist
          cp app.py dist/app.py
          echo "Artifact built successfully"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app-artifact
          path: dist/

  deploy-development:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: development

    steps:
      - name: Deploy to Development
        run: echo "Deploying to development environment"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: deploy-development
    environment: staging

    steps:
      - name: Deploy to Staging
        run: echo "Deploying to staging environment"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - name: Deploy to Production
        run: echo "Deploying to production environment"

      - name: Monitoring
        run: echo "Monitoring application after deployment"

      - name: Rollback / Feedback
        run: echo "Rollback plan ready and feedback loop recorded"
